# ============================================
# PROXVEL - Docker Compose
# Servicios: PostgreSQL 16 + FastAPI Backend
# ============================================
# IMPORTANTE: Reutiliza el volumen externo existente
# para preservar todos los datos de PostgreSQL.
# ============================================

services:
  postgres:
    image: postgres:16
    container_name: proxvel_postgres_new
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proxvel_db}
      POSTGRES_USER: ${POSTGRES_USER:-proxvel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proxvel_password}
    ports:
      - "5432:5432"
    volumes:
      - proxvel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxvel_user -d proxvel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxvel_backend
    restart: unless-stopped
    env_file:
      - .env.docker
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://proxvel_user:proxvel_password@postgres:5432/proxvel_db

volumes:
  proxvel_postgres_data:
